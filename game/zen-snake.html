<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>禅意贪吃蛇 · Zen Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    background: #1c1c24;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Helvetica Neue', 'PingFang SC', -apple-system, sans-serif;
    overflow: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  canvas {
    display: block;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(255,255,255,0.03);
  }

  .info-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    color: rgba(255,255,255,0.50);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 2px;
  }

  .info-bar .length {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info-bar .length span {
    color: rgba(255,255,255,0.75);
    font-size: 18px;
    font-weight: 200;
    min-width: 2em;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .btn-group {
    display: flex;
    gap: 16px;
  }

  .btn-group button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.40);
    font-size: 12px;
    letter-spacing: 1px;
    padding: 6px 18px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.4s ease;
    font-family: inherit;
  }

  .btn-group button:hover {
    border-color: rgba(255,255,255,0.30);
    color: rgba(255,255,255,0.70);
    background: rgba(255,255,255,0.04);
  }

  .btn-group button:active {
    transform: scale(0.96);
  }

  .hint {
    color: rgba(255,255,255,0.18);
    font-size: 11px;
    letter-spacing: 1.5px;
    font-weight: 200;
    margin-top: 4px;
  }

  /* ── 播放器 ── */
  .player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-top: -8px;
    position: relative;
    min-height: 28px;
  }

  .now-playing {
    color: rgba(255,255,255,0.28);
    font-size: 11px;
    font-weight: 200;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: color 0.3s;
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .now-playing:hover { color: rgba(255,255,255,0.55); }
  .now-playing .sep { color: rgba(255,255,255,0.12); margin: 0 6px; }

  .playlist {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14,14,18,0.92);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 6px 0;
    min-width: 260px;
    max-height: 200px;
    overflow-y: auto;
    backdrop-filter: blur(8px);
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.08) transparent;
    z-index: 10;
  }
  .playlist.open { display: block; }

  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

  .playlist-item {
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    font-weight: 200;
    letter-spacing: 0.3px;
    padding: 6px 18px;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .playlist-item:hover { color: rgba(255,255,255,0.70); background: rgba(255,255,255,0.04); }
  .playlist-item.active { color: rgba(255,255,255,0.70); }
</style>
</head>
<body>
<div class="container">
  <canvas id="gameCanvas"></canvas>

  <div class="info-bar">
    <div class="length">◈ <span id="lengthDisplay">0</span></div>
    <div class="btn-group">
      <button id="restartBtn">⟳</button>
      <button id="pauseBtn">‖</button>
      <button id="musicBtn">♫</button>
    </div>
  </div>

  <div class="hint" id="hint">方向键移动 · 穿墙 · 穿过自己会缩短</div>

  <div class="player" id="player">
    <div class="now-playing" id="nowPlaying">
      <span class="sep">—</span> 未播放 <span class="sep">—</span>
    </div>
    <div class="playlist" id="playlist"></div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const lengthDisplay = document.getElementById('lengthDisplay');
  const restartBtn = document.getElementById('restartBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const musicBtn = document.getElementById('musicBtn');
  const hint = document.getElementById('hint');
  const nowPlaying = document.getElementById('nowPlaying');
  const playlistEl = document.getElementById('playlist');

  // ── 配置 ──
  const GRID_SIZE = 26;          // 网格大小（像素）
  const GRID_W = 48;             // 列数
  const GRID_H = 26;             // 行数
  const TICK_MS = 140;           // 移动间隔（毫秒）

  // ── 状态 ──
  let snake = [];                // 坐标数组 [{x, y}, ...]
  let food = { x: 0, y: 0 };
  let direction = { dx: 1, dy: 0 };
  let nextDirection = { dx: 1, dy: 0 };
  let paused = false;
  let gameOver = false;          // 实际永不 game over，保留用于重启
  let tickTimer = null;
  let animFrame = null;
  let pulsePhase = 0;            // 食物呼吸相位

  // 拖尾粒子
  let trailParticles = [];       // [{x, y, alpha, life}, ...]

  // 背景星点 & 星云
  const stars = [];
  const STAR_COUNT = 280;
  const nebulaClouds = [];     // [{x, y, r, r2, color, alpha}]
  const shootingStars = [];    // [{x, y, vx, vy, life, len}]
  let shootingStarTimer = 0;
  // 划痕
  const scratches = [];        // [{x, y, angle, len, life, maxLife, alpha, width}]
  let scratchTimer = 0;

  // ── 音频引擎 ──
  let audioEl = null;
  let isMusicPlaying = false;
  let currentTrackIdx = -1;
  let trackList = [];
  let playlistOpen = false;

  function updateNowPlaying() {
    if (currentTrackIdx >= 0 && currentTrackIdx < trackList.length) {
      const name = trackList[currentTrackIdx].replace(/\.mp3$/, '');
      nowPlaying.textContent = '♫  ' + name;
    } else {
      nowPlaying.innerHTML = '<span class="sep">—</span> 未播放 <span class="sep">—</span>';
    }
  }

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    trackList.forEach((name, i) => {
      const item = document.createElement('div');
      item.className = 'playlist-item' + (i === currentTrackIdx ? ' active' : '');
      item.textContent = name.replace(/\.mp3$/, '');
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        selectTrack(i);
        closePlaylist();
      });
      playlistEl.appendChild(item);
    });
  }

  function openPlaylist() {
    renderPlaylist();
    playlistEl.classList.add('open');
    playlistOpen = true;
  }

  function closePlaylist() {
    playlistEl.classList.remove('open');
    playlistOpen = false;
  }

  function togglePlaylist() {
    playlistOpen ? closePlaylist() : openPlaylist();
  }

  function selectTrack(idx) {
    if (idx < 0 || idx >= trackList.length) return;
    currentTrackIdx = idx;
    if (!isMusicPlaying) {
      initAudio();
      isMusicPlaying = true;
      musicBtn.textContent = '♫';
    }
    const src = 'music/' + encodeURIComponent(trackList[idx]);
    if (!audioEl) initAudio();
    audioEl.src = src;
    audioEl.play().catch(() => {});
    updateNowPlaying();
    // 高亮当前曲目
    document.querySelectorAll('.playlist-item').forEach((el, i) => {
      el.classList.toggle('active', i === idx);
    });
  }

  function pickNextTrack() {
    if (trackList.length === 0) return null;
    let idx;
    do {
      idx = Math.floor(Math.random() * trackList.length);
    } while (idx === currentTrackIdx && trackList.length > 1);
    return idx;
  }

  function initAudio() {
    if (audioEl) return;
    audioEl = new Audio();
    audioEl.volume = 0.30;
    audioEl.addEventListener('ended', () => {
      if (isMusicPlaying) {
        const next = pickNextTrack();
        if (next !== null) selectTrack(next);
      }
    });
  }

  function loadPlaylist() {
    fetch('/api/playlist')
      .then(r => r.json())
      .then(list => {
        trackList = list;
        renderPlaylist();
      })
      .catch(() => {});
  }

  function startMusic() {
    if (isMusicPlaying) return;
    initAudio();
    isMusicPlaying = true;
    if (currentTrackIdx < 0 || currentTrackIdx >= trackList.length) {
      const next = pickNextTrack();
      if (next !== null) currentTrackIdx = next;
    }
    if (currentTrackIdx >= 0 && currentTrackIdx < trackList.length) {
      selectTrack(currentTrackIdx);
    }
  }

  function stopMusic() {
    isMusicPlaying = false;
    if (audioEl) {
      audioEl.pause();
      audioEl.currentTime = 0;
    }
  }

  function toggleMusic() {
    (isMusicPlaying ? stopMusic : startMusic)();
    musicBtn.textContent = isMusicPlaying ? '♫' : '♪';
  }

  // ── 尺寸适配 ──
  function resizeCanvas() {
    const cw = GRID_W * GRID_SIZE;
    const ch = GRID_H * GRID_SIZE;
    const maxW = window.innerWidth - 40;
    const maxH = window.innerHeight - 160;
    const scale = Math.min(1, maxW / cw, maxH / ch);
    canvas.width = cw;
    canvas.height = ch;
    canvas.style.width = (cw * scale) + 'px';
    canvas.style.height = (ch * scale) + 'px';
  }

  // ── 星空生成 ──
  function initStars() {
    stars.length = 0;
    nebulaClouds.length = 0;
    shootingStars.length = 0;
    scratches.length = 0;
    const W = GRID_W * GRID_SIZE;
    const H = GRID_H * GRID_SIZE;

    // 三层星点
    for (let i = 0; i < STAR_COUNT; i++) {
      const layer = Math.random();
      let r, alpha, color;
      if (layer < 0.15) {
        // 近层：大而暖
        r = Math.random() * 1.8 + 0.8;
        alpha = Math.random() * 0.5 + 0.25;
        const warmth = Math.random() * 0.15;
        color = [255, 255 - warmth * 60, 255 - warmth * 100];
      } else if (layer < 0.50) {
        // 中层：标准白
        r = Math.random() * 1.2 + 0.4;
        alpha = Math.random() * 0.4 + 0.15;
        const tint = Math.random() * 0.08;
        color = [255, 255 - tint * 30, 255 - tint * 20];
      } else {
        // 远层：小而冷
        r = Math.random() * 0.8 + 0.2;
        alpha = Math.random() * 0.3 + 0.08;
        const cool = Math.random() * 0.2;
        color = [200 + cool * 55, 200 + cool * 55, 255];
      }
      // 流动速度：近层快、远层慢，方向随机
      const speedScale = layer < 0.15 ? 0.08 : layer < 0.50 ? 0.04 : 0.015;
      const angle = Math.random() * Math.PI * 2;
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r,
        alpha,
        color,
        vx: Math.cos(angle) * speedScale,
        vy: Math.sin(angle) * speedScale,
        twinkleSpeed: Math.random() * 0.03 + 0.005,
        twinkleOffset: Math.random() * Math.PI * 2,
        twinkleAmp: Math.random() * 0.3 + 0.2,
      });
    }

    // 星云（2-3 团极淡彩色光晕）
    const nebulaColors = [
      [80, 60, 140],
      [40, 60, 120],
      [100, 50, 80],
    ];
    const count = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < count; i++) {
      const c = nebulaColors[i % nebulaColors.length];
      nebulaClouds.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: W * (0.2 + Math.random() * 0.3),
        color: c,
        alpha: 0.012 + Math.random() * 0.01,
      });
    }
  }

  // ── 初始化 ──
  function initGame() {
    const cx = Math.floor(GRID_W / 2);
    const cy = Math.floor(GRID_H / 2);
    snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy },
    ];
    direction = { dx: 1, dy: 0 };
    nextDirection = { dx: 1, dy: 0 };
    trailParticles = [];
    paused = false;
    pauseBtn.textContent = '‖';
    hint.textContent = '方向键移动 · 穿墙 · 穿过自己会缩短';
    spawnFood();
    updateLengthDisplay();
  }

  // ── 食物生成（不与蛇重叠）─ ─
  function spawnFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    const free = [];
    for (let x = 0; x < GRID_W; x++) {
      for (let y = 0; y < GRID_H; y++) {
        if (!occupied.has(`${x},${y}`)) free.push({ x, y });
      }
    }
    if (free.length === 0) return;
    const pos = free[Math.floor(Math.random() * free.length)];
    food = pos;
  }

  // ── 更新显示长度 ──
  function updateLengthDisplay() {
    lengthDisplay.textContent = snake.length;
  }

  // ── 游戏逻辑 ──
  function tick() {
    if (paused || gameOver) return;

    // 应用方向
    direction = { ...nextDirection };

    // 计算新头部
    const head = snake[0];
    let nx = head.x + direction.dx;
    let ny = head.y + direction.dy;

    // 穿墙
    if (nx < 0) nx = GRID_W - 1;
    if (nx >= GRID_W) nx = 0;
    if (ny < 0) ny = GRID_H - 1;
    if (ny >= GRID_H) ny = 0;

    const newHead = { x: nx, y: ny };

    // 检查是否吃到食物
    const ate = (nx === food.x && ny === food.y);

    if (ate) {
      // 加长：不弹尾部
      snake = [newHead, ...snake];
      spawnFood();
    } else {
      // 检查是否撞到自己
      const hitSelf = snake.some((seg, i) => i > 0 && seg.x === nx && seg.y === ny);
      if (hitSelf) {
        // 缩短一节（弹尾部）
        snake.pop();
        // 加拖尾粒子（尾部消散效果）
        if (snake.length > 0) {
          const tail = snake[snake.length - 1];
          for (let i = 0; i < 6; i++) {
            trailParticles.push({
              x: tail.x * GRID_SIZE + GRID_SIZE / 2,
              y: tail.y * GRID_SIZE + GRID_SIZE / 2,
              vx: (Math.random() - 0.5) * 0.8,
              vy: (Math.random() - 0.5) * 0.8,
              alpha: 0.5,
              life: 1.0,
            });
          }
        }
      }
      // 正常移动
      snake = [newHead, ...snake.slice(0, -1)];
    }

    // 拖尾粒子：蛇尾轨迹
    if (snake.length > 1) {
      const last = snake[snake.length - 1];
      if (Math.random() < 0.3) {
        trailParticles.push({
          x: last.x * GRID_SIZE + GRID_SIZE / 2,
          y: last.y * GRID_SIZE + GRID_SIZE / 2,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          alpha: 0.25,
          life: 1.0,
        });
      }
    }

    // 限制粒子数量
    if (trailParticles.length > 100) {
      trailParticles.splice(0, trailParticles.length - 100);
    }

    updateLengthDisplay();
  }

  // ── 绘制 ──
  function draw() {
    pulsePhase += 0.025;

    // 更新粒子
    for (let i = trailParticles.length - 1; i >= 0; i--) {
      const p = trailParticles[i];
      p.x += p.vx || 0;
      p.y += p.vy || 0;
      p.life -= 0.025;
      p.alpha = p.life * 0.3;
      if (p.life <= 0) {
        trailParticles.splice(i, 1);
      }
    }

    // 清屏
    ctx.fillStyle = '#1c1c24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // ── 星云 ──
    for (const neb of nebulaClouds) {
      const grad = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r);
      grad.addColorStop(0, `rgba(${neb.color[0]},${neb.color[1]},${neb.color[2]},${neb.alpha})`);
      grad.addColorStop(0.5, `rgba(${neb.color[0]},${neb.color[1]},${neb.color[2]},${neb.alpha * 0.4})`);
      grad.addColorStop(1, `rgba(${neb.color[0]},${neb.color[1]},${neb.color[2]},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // ── 星点（流动） ──
    for (const star of stars) {
      // 更新位置
      star.x += star.vx;
      star.y += star.vy;
      if (star.x < -10) star.x = canvas.width + 10;
      if (star.x > canvas.width + 10) star.x = -10;
      if (star.y < -10) star.y = canvas.height + 10;
      if (star.y > canvas.height + 10) star.y = -10;

      const twinkle = Math.sin(pulsePhase * star.twinkleSpeed * 10 + star.twinkleOffset);
      const twinkleAlpha = 1 - star.twinkleAmp + star.twinkleAmp * (0.5 + 0.5 * twinkle);
      const alpha = star.alpha * twinkleAlpha;
      const [r, g, b] = star.color;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();

      // 亮星有十字光芒
      if (star.r > 1.8 && alpha > 0.3) {
        const spikeLen = star.r * 1.8;
        ctx.strokeStyle = `rgba(${r},${g},${b},${alpha * 0.2})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(star.x - spikeLen, star.y);
        ctx.lineTo(star.x + spikeLen, star.y);
        ctx.moveTo(star.x, star.y - spikeLen);
        ctx.lineTo(star.x, star.y + spikeLen);
        ctx.stroke();
      }
    }

    // ── 划痕 ──
    scratchTimer += 0.016;
    if (scratchTimer > 0.6 + Math.random() * 1.5) {
      scratchTimer = 0;
      const W = canvas.width, H = canvas.height;
      const isHorz = Math.random() < 0.65;
      const len = 15 + Math.random() * 55;
      const x = Math.random() * (W + len * 2) - len;
      const y = Math.random() * (H + len * 2) - len;
      scratches.push({
        x, y,
        angle: isHorz ? (Math.random() - 0.5) * 0.3 : Math.PI / 2 + (Math.random() - 0.5) * 0.3,
        len,
        life: 0,
        maxLife: 0.8 + Math.random() * 1.2,
        alpha: 0.04 + Math.random() * 0.06,
        width: 0.3 + Math.random() * 0.7,
      });
    }
    for (let i = scratches.length - 1; i >= 0; i--) {
      const s = scratches[i];
      s.life += 0.016;
      if (s.life > s.maxLife) { scratches.splice(i, 1); continue; }
      const progress = s.life / s.maxLife;
      // 快闪 → 保持 → 渐隐
      let alpha = s.alpha;
      if (progress < 0.15) alpha *= progress / 0.15;
      else if (progress > 0.6) alpha *= (1 - progress) / 0.4;
      const half = s.len / 2;
      ctx.beginPath();
      ctx.moveTo(
        s.x - Math.cos(s.angle) * half,
        s.y - Math.sin(s.angle) * half
      );
      ctx.lineTo(
        s.x + Math.cos(s.angle) * half,
        s.y + Math.sin(s.angle) * half
      );
      ctx.strokeStyle = `rgba(200,210,255,${alpha})`;
      ctx.lineWidth = s.width;
      ctx.stroke();
    }

    // ── 流星 ──
    shootingStarTimer += 0.016;
    if (shootingStarTimer > 3 + Math.random() * 5) {
      shootingStarTimer = 0;
      const angle = Math.PI * 0.2 + Math.random() * 0.3;
      const speed = 2 + Math.random() * 3;
      shootingStars.push({
        x: Math.random() * canvas.width * 1.2 - canvas.width * 0.1,
        y: Math.random() * canvas.height * 0.4,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1.0,
        decay: 0.008 + Math.random() * 0.008,
        len: 20 + Math.random() * 30,
      });
    }
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += s.vx;
      s.y += s.vy;
      s.life -= s.decay;
      if (s.life <= 0) { shootingStars.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * s.len * s.life, s.y - s.vy * s.len * s.life);
      ctx.strokeStyle = `rgba(220,220,255,${s.life * 0.35})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
      // 流星尾端光晕
      const tailGrad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 4);
      tailGrad.addColorStop(0, `rgba(220,220,255,${s.life * 0.2})`);
      tailGrad.addColorStop(1, 'rgba(220,220,255,0)');
      ctx.fillStyle = tailGrad;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }


    // ── 拖尾粒子 ──
    for (const p of trailParticles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,200,220,${p.alpha})`;
      ctx.fill();
    }

    // ── 蛇：流光溢彩 ──
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const px = seg.x * GRID_SIZE + GRID_SIZE / 2;
      const py = seg.y * GRID_SIZE + GRID_SIZE / 2;
      const t = i / Math.max(snake.length - 1, 1);
      const baseRadius = GRID_SIZE * 0.40;
      const radius = baseRadius * (0.5 + 0.5 * t);

      // 流动色彩：每节 hue 沿身体渐变 + 时间流动
      const hue = (t * 240 + pulsePhase * 30) % 360;
      const sat = 40 + 20 * t;
      const lig = 45 + 25 * t;

      // 发光
      const glowRadius = radius * 2.8;
      const glow = ctx.createRadialGradient(px, py, 0, px, py, glowRadius);
      const glowAlpha = 0.07 + 0.07 * t;
      glow.addColorStop(0, `hsla(${hue},${sat}%,${lig + 20}%,${glowAlpha})`);
      glow.addColorStop(1, `hsla(${hue},${sat}%,${lig + 20}%,0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(px, py, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      // 蛇身圆点
      const bodyAlpha = 0.30 + 0.50 * t;
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue},${sat}%,${lig}%,${bodyAlpha})`;
      ctx.fill();

      // 头部额外光晕
      if (i === 0) {
        const headGlow = ctx.createRadialGradient(px, py, 0, px, py, GRID_SIZE * 1.4);
        headGlow.addColorStop(0, `hsla(${hue},70%,70%,0.12)`);
        headGlow.addColorStop(1, 'hsla(0,0%,100%,0)');
        ctx.fillStyle = headGlow;
        ctx.beginPath();
        ctx.arc(px, py, GRID_SIZE * 1.4, 0, Math.PI * 2);
        ctx.fill();

        // 头部的眼睛（两个极淡小点）
        const eyeOff = GRID_SIZE * 0.22;
        const eyeR = 1.5;
        const angle = Math.atan2(direction.dy, direction.dx);
        const ex1 = px + Math.cos(angle + 0.6) * eyeOff;
        const ey1 = py + Math.sin(angle + 0.6) * eyeOff;
        const ex2 = px + Math.cos(angle - 0.6) * eyeOff;
        const ey2 = py + Math.sin(angle - 0.6) * eyeOff;
        ctx.beginPath();
        ctx.arc(ex1, ey1, eyeR, 0, Math.PI * 2);
        ctx.arc(ex2, ey2, eyeR, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue},60%,80%,0.35)`;
        ctx.fill();
      }
    }

    // ── 食物：呼吸脉动 ──
    const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
    const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
    const breathe = 0.7 + 0.3 * Math.sin(pulsePhase * 2);

    // 外层光晕
    const foodGlow = ctx.createRadialGradient(fx, fy, 0, fx, fy, GRID_SIZE * breathe * 1.5);
    foodGlow.addColorStop(0, 'rgba(255,255,255,0.12)');
    foodGlow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = foodGlow;
    ctx.beginPath();
    ctx.arc(fx, fy, GRID_SIZE * breathe * 1.5, 0, Math.PI * 2);
    ctx.fill();

    // 内层光点
    const foodR = GRID_SIZE * 0.20 * breathe;
    const foodGlow2 = ctx.createRadialGradient(fx, fy, 0, fx, fy, foodR * 3);
    foodGlow2.addColorStop(0, 'rgba(255,255,255,0.6)');
    foodGlow2.addColorStop(0.5, 'rgba(255,255,255,0.2)');
    foodGlow2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = foodGlow2;
    ctx.beginPath();
    ctx.arc(fx, fy, foodR * 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(fx, fy, foodR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fill();

    // ── 暂停覆盖 ──
    if (paused) {
      ctx.fillStyle = 'rgba(28,28,36,0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255,255,255,0.20)';
      ctx.font = '200 18px "Helvetica Neue", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('‖', canvas.width / 2, canvas.height / 2);
    }

    animFrame = requestAnimationFrame(draw);
  }

  // ── 按键 ──
  function onKeyDown(e) {
    const key = e.key;
    e.preventDefault();

    if (key === ' ' || key === 'Space') {
      togglePause();
      return;
    }

    if (paused || gameOver) return;

    const map = {
      'ArrowUp':    { dx: 0,  dy: -1 },
      'ArrowDown':  { dx: 0,  dy: 1 },
      'ArrowLeft':  { dx: -1, dy: 0 },
      'ArrowRight': { dx: 1,  dy: 0 },
    };
    const nd = map[key];
    if (!nd) return;

    // 禁止原地掉头
    if (direction.dx + nd.dx === 0 && direction.dy + nd.dy === 0) return;

    nextDirection = nd;
  }

  // ── 暂停切换 ──
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '‖';
    hint.textContent = paused ? '暂停中 …' : '方向键移动 · 穿墙 · 穿过自己会缩短';
  }

  // ── 重启 ──
  function restart() {
    // 清理旧定时器
    if (tickTimer) clearInterval(tickTimer);
    initGame();
    hint.textContent = '方向键移动 · 穿墙 · 穿过自己会缩短';
  }

  // ── 启动 ──
  function start() {
    resizeCanvas();
    initStars();
    initGame();

    if (animFrame) cancelAnimationFrame(animFrame);
    draw();

    if (tickTimer) clearInterval(tickTimer);
    tickTimer = setInterval(tick, TICK_MS);

    loadPlaylist();

    // 事件绑定
    window.addEventListener('keydown', onKeyDown);
    restartBtn.addEventListener('click', restart);
    pauseBtn.addEventListener('click', togglePause);
    musicBtn.addEventListener('click', toggleMusic);
    nowPlaying.addEventListener('click', togglePlaylist);
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.player')) closePlaylist();
    });
    window.addEventListener('resize', resizeCanvas);
  }

  start();
})();
</script>
</body>
</html>
